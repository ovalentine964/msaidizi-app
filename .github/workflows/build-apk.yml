# ──────────────────────────────────────────────────────────────
# Msaidizi APK Build & Release Pipeline
# Builds debug + release APKs with bundled AI models, signs the
# release variant, and publishes to GitHub Releases on tags.
#
# Models bundled in APK:
#   - Qwen3.5 0.8B GGUF (~500MB) — on-device LLM
#   - sherpa-onnx Whisper Tiny (~40MB) — speech-to-text
#   - Piper Swahili (~15MB) — text-to-speech
# ──────────────────────────────────────────────────────────────
name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (debug / release / both)"
        required: false
        default: "both"
        type: choice
        options:
          - debug
          - release
          - both

# Cancel redundant runs on the same ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  JAVA_VERSION: "17"
  MODEL_CACHE_VERSION: "v1"

permissions:
  contents: write          # push tags & upload release assets

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Download & Cache Models
  # ──────────────────────────────────────────────────────────
  prepare-models:
    name: Prepare AI Models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Model Cache ────────────────────────────────────────
      - name: Cache AI models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: ai-models-${{ env.MODEL_CACHE_VERSION }}-${{ hashFiles('scripts/download_models.sh') }}-${{ hashFiles('scripts/model_checksums.sha256') }}
          restore-keys: |
            ai-models-${{ env.MODEL_CACHE_VERSION }}-${{ hashFiles('scripts/download_models.sh') }}-

      - name: Download AI models
        run: |
          chmod +x scripts/download_models.sh
          ./scripts/download_models.sh

      - name: Verify model assets
        run: ./scripts/download_models.sh --verify

      - name: Report model sizes
        run: |
          echo "::group::Model asset sizes"
          du -sh app/src/main/assets/models/*/
          du -sh app/src/main/assets/models/
          echo "::endgroup::"

  # ──────────────────────────────────────────────────────────
  # 2. Build
  # ──────────────────────────────────────────────────────────
  build:
    name: Build APK (${{ matrix.build_type }})
    needs: prepare-models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        flavor: [cloud, full]
        exclude:
          - build_type: ${{ github.event.inputs.build_type == 'release' && 'debug' || 'none' }}
          - build_type: ${{ github.event.inputs.build_type == 'debug' && 'release' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Native Dependencies Cache ──────────────────────────
      - name: Cache native dependencies
        id: native-cache
        uses: actions/cache@v4
        with:
          path: voice/src/main/cpp/third_party
          key: native-deps-${{ hashFiles('scripts/setup_native_deps.sh') }}
          restore-keys: |
            native-deps-${{ hashFiles('scripts/setup_native_deps.sh') }}-

      - name: Setup native dependencies (llama.cpp + sherpa-onnx)
        run: |
          chmod +x scripts/setup_native_deps.sh
          # llama.cpp: clone from source (no pre-built Android libs available)
          ./scripts/setup_native_deps.sh --llama-only
          # sherpa-onnx: use pre-built AAR to avoid onnxruntime download failure in CI.
          # If prebuilt fails, try source build. If that also fails, continue in stub
          # mode (CMakeLists.txt handles missing sherpa-onnx gracefully).
          ./scripts/setup_native_deps.sh --prebuilt \
            || ./scripts/setup_native_deps.sh --sherpa-only \
            || echo "::warning::sherpa-onnx setup failed — building in stub mode (ASR/TTS disabled)"

      # ── Restore model cache ────────────────────────────────
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: ai-models-${{ env.MODEL_CACHE_VERSION }}-${{ hashFiles('scripts/download_models.sh') }}-${{ hashFiles('scripts/model_checksums.sha256') }}
          restore-keys: |
            ai-models-${{ env.MODEL_CACHE_VERSION }}-${{ hashFiles('scripts/download_models.sh') }}-

      - name: Place cached models in assets
        run: |
          chmod +x scripts/download_models.sh
          ./scripts/download_models.sh

      - name: Remove LLM model for cloud flavor
        if: matrix.flavor == 'cloud'
        run: |
          echo "Removing LLM model for cloud flavor (uses cloud API instead)"
          rm -rf app/src/main/assets/models/gguf/
          echo "LLM model removed — cloud flavor will use Groq API"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode keystore (release only)
        if: matrix.build_type == 'release'
        run: |
          echo "${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release-keystore.jks

      - name: Build ${{ matrix.flavor }}-${{ matrix.build_type }} APK
        run: |
          TASK="assemble${{ matrix.flavor }}${{ matrix.build_type == 'release' && 'Release' || 'Debug' }}"
          if [ "${{ matrix.build_type }}" = "release" ]; then
            ./gradlew "$TASK" \
              -Pandroid.injected.signing.store.file=/tmp/release-keystore.jks \
              -Pandroid.injected.signing.store.password="${{ secrets.APK_KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.APK_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.APK_KEY_PASSWORD }}"
          else
            ./gradlew "$TASK"
          fi

      - name: Rename APK
        id: rename
        run: |
          FLAVOR="${{ matrix.flavor }}"
          BTYPE="${{ matrix.build_type }}"
          APK_DIR="app/build/outputs/apk/${FLAVOR}/${BTYPE}"
          APK_PATH=$(find "$APK_DIR" -name "*.apk" | head -1)
          DEST="msaidizi-${FLAVOR}-${BTYPE}.apk"
          cp "$APK_PATH" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(du -h "$DEST" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: msaidizi-${{ matrix.flavor }}-${{ matrix.build_type }}-apk
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keystore
        if: always() && matrix.build_type == 'release'
        run: rm -f /tmp/release-keystore.jks

  # ──────────────────────────────────────────────────────────
  # 3. Verify (smoke test the APK)
  # ──────────────────────────────────────────────────────────
  verify:
    name: Verify APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download cloud release APK
        uses: actions/download-artifact@v4
        with:
          name: msaidizi-cloud-release-apk
          path: ./artifacts
        continue-on-error: true

      - name: Download cloud debug APK
        uses: actions/download-artifact@v4
        with:
          name: msaidizi-cloud-debug-apk
          path: ./artifacts
        continue-on-error: true

      - name: Download full release APK
        uses: actions/download-artifact@v4
        with:
          name: msaidizi-full-release-apk
          path: ./artifacts
        continue-on-error: true

      - name: Download full debug APK
        uses: actions/download-artifact@v4
        with:
          name: msaidizi-full-debug-apk
          path: ./artifacts
        continue-on-error: true

      - name: Verify APK contents
        run: |
          set -e
          for apk in artifacts/*.apk; do
            [ -f "$apk" ] || continue
            echo "=== Inspecting: $apk ==="
            # Check APK is valid zip
            unzip -t "$apk" > /dev/null
            echo "✅ Valid ZIP/APK"
            # Check for native libs
            NATIVE_COUNT=$(unzip -l "$apk" | grep -c "lib/arm" || true)
            echo "📦 Native library entries: $NATIVE_COUNT"
            # Check for model assets
            ASSET_COUNT=$(unzip -l "$apk" | grep -c "assets/models/" || true)
            echo "🧠 Model asset entries: $ASSET_COUNT"
            # Verify specific model files
            echo ""
            echo "── Model files in APK ──"
            unzip -l "$apk" | grep -E "assets/models/(gguf|onnx)" | head -20 || true
            echo ""
            # Verify ABI directories
            unzip -l "$apk" | grep "lib/arm64-v8a/" > /dev/null && echo "✅ arm64-v8a present" || echo "⚠️  arm64-v8a missing"
            unzip -l "$apk" | grep "lib/armeabi-v7a/" > /dev/null && echo "✅ armeabi-v7a present" || echo "⚠️  armeabi-v7a missing"
            echo ""
          done

  # ──────────────────────────────────────────────────────────
  # 4. Release (only on version tags)
  # ──────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${{ github.ref_name }}" ]; then
            CHANGES=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES="- Initial release"
          fi
          # Write to file (multi-line output)
          {
            echo "changes<<CHANGELOG_EOF"
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "## Bundled AI Models"
            echo ""
            echo "This APK includes on-device AI models (no download required after install):"
            echo ""
            echo "| Model | Type | Size |"
            echo "|-------|------|------|"
            echo "| Qwen3.5 0.8B (Q4_K_M) | LLM (text generation) | ~500 MB |"
            echo "| Whisper Tiny (multilingual) | STT (speech-to-text) | ~40 MB |"
            echo "| Piper Swahili | TTS (text-to-speech) | ~15 MB |"
            echo ""
            echo "**Total APK size:** ~550-600 MB (includes all models)"
            echo ""
            echo "## Installation"
            echo ""
            echo "1. Download \`msaidizi-release.apk\` below"
            echo "2. Enable 'Install from unknown sources' on your Android device"
            echo "3. Open the APK to install"
            echo "4. Models are bundled — no download required on first launch"
            echo ""
            echo "**Minimum:** Android 8.0 (API 26) · ARM64 or ARM32 · 3GB RAM recommended"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Msaidizi ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            release-assets/msaidizi-cloud-release.apk
            release-assets/msaidizi-cloud-debug.apk
            release-assets/msaidizi-full-release.apk
            release-assets/msaidizi-full-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
