<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004E64"/>
      <stop offset="50%" stop-color="#0A2A3D"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E8A838"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#004E64" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bannerClip">
      <rect width="1280" height="640" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#E8A838" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="640"/><line x1="80" y1="0" x2="80" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="240" y1="0" x2="240" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/><line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="560" y1="0" x2="560" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/><line x1="720" y1="0" x2="720" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/><line x1="880" y1="0" x2="880" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/><line x1="1040" y1="0" x2="1040" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/><line x1="1200" y1="0" x2="1200" y2="640"/>
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Voice waveform pattern (background) -->
  <g opacity="0.08" transform="translate(0, 320)">
    <path d="M0,0 Q40,-80 80,0 Q120,80 160,0 Q200,-60 240,0 Q280,60 320,0 Q360,-100 400,0 Q440,100 480,0 Q520,-70 560,0 Q600,70 640,0 Q680,-90 720,0 Q760,90 800,0 Q840,-60 880,0 Q920,60 960,0 Q1000,-80 1040,0 Q1080,80 1120,0 Q1160,-50 1200,0 Q1240,50 1280,0" fill="none" stroke="#FF6B35" stroke-width="2"/>
    <path d="M0,20 Q40,-60 80,20 Q120,100 160,20 Q200,-40 240,20 Q280,80 320,20 Q360,-80 400,20 Q440,120 480,20 Q520,-50 560,20 Q600,90 640,20 Q680,-70 720,20 Q760,110 800,20 Q840,-40 880,20 Q920,80 960,20 Q1000,-60 1040,20 Q1080,100 1120,20 Q1160,-30 1200,20 Q1240,70 1280,20" fill="none" stroke="#E8A838" stroke-width="1.5"/>
    <path d="M0,-20 Q40,-100 80,-20 Q120,60 160,-20 Q200,-80 240,-20 Q280,40 320,-20 Q360,-120 400,-20 Q440,80 480,-20 Q520,-90 560,-20 Q600,50 640,-20 Q680,-110 720,-20 Q760,70 800,-20 Q840,-80 880,-20 Q920,40 960,-20 Q1000,-100 1040,-20 Q1080,60 1120,-20 Q1160,-70 1200,-20 Q1240,30 1280,-20" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Sound wave circles (left side) -->
  <g opacity="0.06" transform="translate(100, 320)">
    <circle r="60" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle r="100" fill="none" stroke="#FF6B35" stroke-width="0.8"/>
    <circle r="140" fill="none" stroke="#FF6B35" stroke-width="0.6"/>
    <circle r="180" fill="none" stroke="#E8A838" stroke-width="0.5"/>
    <circle r="220" fill="none" stroke="#E8A838" stroke-width="0.4"/>
  </g>

  <!-- Network nodes (scattered) -->
  <g opacity="0.12">
    <circle cx="900" cy="100" r="3" fill="#E8A838"/>
    <circle cx="950" cy="150" r="2" fill="#FF6B35"/>
    <circle cx="1000" cy="80" r="2.5" fill="#E8A838"/>
    <circle cx="1050" cy="180" r="2" fill="#FF6B35"/>
    <circle cx="1100" cy="120" r="3" fill="#E8A838"/>
    <circle cx="1150" cy="200" r="2" fill="#FF6B35"/>
    <circle cx="1020" cy="140" r="1.5" fill="#E8A838"/>
    <line x1="900" y1="100" x2="950" y2="150" stroke="#E8A838" stroke-width="0.5" opacity="0.3"/>
    <line x1="950" y1="150" x2="1000" y2="80" stroke="#E8A838" stroke-width="0.5" opacity="0.3"/>
    <line x1="1000" y1="80" x2="1050" y2="180" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
    <line x1="1050" y1="180" x2="1100" y2="120" stroke="#E8A838" stroke-width="0.5" opacity="0.3"/>
    <line x1="1100" y1="120" x2="1150" y2="200" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
    <line x1="950" y1="150" x2="1020" y2="140" stroke="#E8A838" stroke-width="0.5" opacity="0.3"/>
    <line x1="1020" y1="140" x2="1100" y2="120" stroke="#E8A838" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Angavu Eye Logo (top-right corner) -->
  <g transform="translate(1150, 70)">
    <!-- Outer arcs (deep blue) -->
    <path d="M-40,0 A40,40 0 0,1 0,-40" fill="none" stroke="#1B4965" stroke-width="3" opacity="0.8"/>
    <path d="M40,0 A40,40 0 0,1 0,40" fill="none" stroke="#1B4965" stroke-width="3" opacity="0.8"/>
    <path d="M-35,0 A35,35 0 0,1 0,-35" fill="none" stroke="#1B4965" stroke-width="2" opacity="0.5"/>
    <path d="M35,0 A35,35 0 0,1 0,35" fill="none" stroke="#1B4965" stroke-width="2" opacity="0.5"/>
    <!-- Iris (golden amber) -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#E8A838" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="#E8A838" opacity="0.3"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="6" fill="#1B4965"/>
    <circle cx="0" cy="0" r="3" fill="#0A1628"/>
    <!-- Iris detail lines -->
    <line x1="0" y1="-12" x2="0" y2="-6" stroke="#E8A838" stroke-width="1" opacity="0.6"/>
    <line x1="12" y1="0" x2="6" y2="0" stroke="#E8A838" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="12" x2="0" y2="6" stroke="#E8A838" stroke-width="1" opacity="0.6"/>
    <line x1="-12" y1="0" x2="-6" y2="0" stroke="#E8A838" stroke-width="1" opacity="0.6"/>
    <!-- Network nodes on logo -->
    <circle cx="30" cy="-30" r="2" fill="#E8A838" opacity="0.6"/>
    <circle cx="-30" cy="30" r="2" fill="#E8A838" opacity="0.6"/>
    <circle cx="35" cy="10" r="1.5" fill="#FF6B35" opacity="0.5"/>
    <circle cx="-35" cy="-10" r="1.5" fill="#FF6B35" opacity="0.5"/>
  </g>

  <!-- Angavu Intelligence small text (top-right) -->
  <text x="1150" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#E8A838" opacity="0.7" text-anchor="middle" letter-spacing="2">ANGAVU INTELLIGENCE</text>

  <!-- Main content -->
  <g transform="translate(80, 0)">
    <!-- Pre-title accent line -->
    <rect x="0" y="210" width="60" height="3" fill="url(#accent)" rx="1.5"/>

    <!-- Title -->
    <text x="0" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Msaidizi</text>

    <!-- Subtitle -->
    <text x="0" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#E8A838" font-weight="400" letter-spacing="0.5">AI-Powered CFO for 600 Million Informal Workers</text>

    <!-- Tagline -->
    <text x="0" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.5" letter-spacing="1">Voice-First · Offline-First · Superagent Architecture</text>

    <!-- Divider -->
    <line x1="0" y1="395" x2="500" y2="395" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>

    <!-- Badges -->
    <g transform="translate(0, 420)">
      <!-- Android badge -->
      <g>
        <rect width="100" height="28" rx="14" fill="#3DDC84" opacity="0.15" stroke="#3DDC84" stroke-width="0.5" opacity="0.3"/>
        <text x="50" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#3DDC84" text-anchor="middle" font-weight="600">🤖 Android</text>
      </g>
      <!-- Kotlin badge -->
      <g transform="translate(110, 0)">
        <rect width="90" height="28" rx="14" fill="#7F52FF" opacity="0.15" stroke="#7F52FF" stroke-width="0.5" opacity="0.3"/>
        <text x="45" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7F52FF" text-anchor="middle" font-weight="600">Kotlin</text>
      </g>
      <!-- Offline-First badge -->
      <g transform="translate(210, 0)">
        <rect width="130" height="28" rx="14" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
        <text x="65" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FF6B35" text-anchor="middle" font-weight="600">📡 Offline-First</text>
      </g>
      <!-- Voice-First badge -->
      <g transform="translate(350, 0)">
        <rect width="125" height="28" rx="14" fill="#E8A838" opacity="0.15" stroke="#E8A838" stroke-width="0.5" opacity="0.3"/>
        <text x="62" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#E8A838" text-anchor="middle" font-weight="600">🎙️ Voice-First</text>
      </g>
    </g>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)" opacity="0.8"/>

  <!-- Bottom-right brand -->
  <text x="1200" y="620" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.25" text-anchor="end" letter-spacing="1">angavu.com</text>
</svg>
